# namer — единый файл настроек (видео + книги).
# Отсутствующий или битый файл — не ошибка: используются дефолты из кода.
# Списки — через запятую; составной токен .fb2.zip делится только по запятой.
# Пары замен — через ';': первый символ пары — заменяемый, далее ':' и замена.
# '|' в замене означает пару открывающий|закрывающий символ.

[video]
extensions = .mp4, .mkv, .avi, .mov, .wmv, .flv, .webm, .m4v, .m2ts, .ts, .mpg, .mpeg, .vob, .iso
template_movie = {title} ({year}) {mod}.{ext}
template_series = {season:02d}.{episode:02d}. {ep_title}.{ext}

[books]
extensions = .fb2, .fb2.zip, .epub, .pdf, .djvu
template_book = {author} - {title} ({year}).{ext}
template_book_series = {author} - {series} - {series_index:02d} - {title}.{ext}

[rename]
max_concurrent_files = 4

[limits]
max_uncompressed_mb = 16
max_entries = 512
max_xml_kb = 2048
timeout_sec = 5.0

[chars]
invalid = \/:*?"<>|
replacements = ?:？; *:×; ::∶; /:∕; \:∖; ":“|”; <:‹; >:›
